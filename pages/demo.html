<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态可视化交互模型</title>
<script src="../js/ggb/deployggb.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0e14; color: #e6edf3; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #header { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: rgba(15,20,28,.96); border-bottom: 1px solid #2a3a4a; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; }
  #title { font-size: 16px; font-weight: 800; color: #00f0ff; letter-spacing: 1px; }
  #backBtn { background: rgba(0,240,255,.15); border: 1px solid #00f0ff; color: #00f0ff; padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 800; transition: background .2s; }
  #backBtn:hover { background: rgba(0,240,255,.35); }
  #applet { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; width: 100%; height: calc(100vh - 52px); }
  #loading { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background: #0b0e14; z-index: 50; }
  #loading .msg { text-align: center; font-size: 15px; line-height: 2; max-width: 90%; }
  #loading .ok { color: #34d399; }
  #loading .err { color: #f87171; }
  #loading .warn { color: #fbbf24; }
  .btn { margin-top: 14px; background: rgba(0,240,255,.15); border: 1px solid #00f0ff; color: #00f0ff; padding: 7px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 800; }
</style>
</head>
<body>

<div id="header">
  <span id="title">动态可视化交互模型</span>
  <button id="backBtn" onclick="window.location.href='../index.html'">⬅ 返回图谱</button>
</div>

<div id="loading">
  <div class="msg" id="loadingMsg">
    <span class="warn">⏳ 正在初始化 GeoGebra 引擎...</span>
  </div>
</div>

<div id="applet"></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = (params.get('id') || '').toUpperCase();
  document.getElementById('title').innerText = id ? ('模型演示：' + id) : '动态可视化交互模型';

  var fileMap = {
    'GP-01': 'files/GP-01_Interval_Neighborhood_Number_Line.ggb',
    'GP-02': 'files/GP-02_Supremum_Infimum_Dynamic.ggb',
    'GP-05': 'files/GP-05_Ultimate_Limit_Permutation.ggb',
    'GP-07': 'files/GP-07_Monotone_Bounded_Theorem.ggb',
    'GP-20': 'files/GP-20_Derivative.ggb',
    'GP-26': 'files/GP-26_Rolle_Lagrange.ggb',
    'GP-42': 'files/GP-42_Riemann_Sum_Trapezoid_Area.ggb'
  };

  function fail(html) {
    document.getElementById('loadingMsg').innerHTML =
      html + '<br><br><button class="btn" onclick="window.location.href=\'../index.html\'">⬅ 返回图谱</button>';
  }

  var ggbFile = fileMap[id];
  if (!ggbFile) {
    fail('<span class="warn">暂未配置模型文件（' + (id || '无ID') + '）</span><br>'
       + '<span style="font-size:12px;color:#8ab4f8">请在 demo.html 的 fileMap 里补一行映射</span>');
    return;
  }

  if (typeof GGBApplet === 'undefined') {
    fail('<span class="err">❌ GeoGebra 离线库未加载</span><br>'
       + '<span style="font-size:12px;color:#8ab4f8">确认 ../js/ggb/deployggb.js 已推送且非 0B</span>');
    return;
  }

  // ① 先造实例，第二个参数 false = 不自动注入（关键！别让它抢跑猜路径）
  var ggbApp = new GGBApplet({
    "appName": "classic",
    "filename": ggbFile,
    "width": "100%",
    "height": "100%",
    "showToolBar": true,
    "showAlgebraInput": true,
    "showMenuBar": true,
    "showResetIcon": true,
    "enableShiftDragZoom": true,
    "useBrowserForJS": false,
    "language": "zh",
    "borderColor": "#0b0e14"
  }, false);   // ← false：手动掌控时序

  // ② 注入前 强制指定 web3d 引擎路径（单斜杠，线上 Linux 才认）
  ggbApp.setHTML5Codebase('../js/ggb/HTML5/5.0/web3d/');

  // ③ 最后才手动注入 → 这次一定会带着正确路径去拉 web3d.nocache.js
  function injectSafely() {
    try {
      ggbApp.inject('applet', 'html5');
    } catch (e) {
      console.error('GeoGebra 注入失败:', e);
      fail('<span class="err">❌ 模型注入异常</span><br>'
         + '<span style="font-size:12px;color:#8ab4f8">' + e.message + '</span><br>'
         + '<span style="font-size:12px;color:#8ab4f8">核对：files/' + ggbFile.split('/').pop() + ' 与 web3d.nocache.js 是否 200</span>');
      return;
    }
    // 给引擎一点加载时间再撤遮罩
    setTimeout(function () {
      var ld = document.getElementById('loading');
      if (ld) ld.style.display = 'none';
    }, 1800);
  }

  if (document.readyState === 'complete') {
    injectSafely();
  } else {
    window.addEventListener('load', injectSafely);
  }

  // ④ 兜底提示：6s 还在转圈，说明引擎依赖没拉下来
  setTimeout(function () {
    var ld = document.getElementById('loading');
    if (ld && ld.style.display !== 'none') {
      document.getElementById('loadingMsg').innerHTML +=
        '<br><span style="font-size:12px;color:#fbbf24;display:inline-block;margin-top:10px;">'
        + '⚠️ 引擎迟迟未就绪:F12→Network 搜 web3d.nocache.js 是否 404</span>';
    }
  }, 6000);
})();
</script>
</body>
</html>
